services:
  mongodb:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data
    restart: unless-stopped

  api:
    build:
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      PORT: 8080
      AWS_EMF_ENVIRONMENT: Local
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/all"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongodb-data:
